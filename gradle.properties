org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# AGP 9 默认启用内建 Kotlin 与新 DSL；MIUIX 需要 Kotlin 2.3，故退回旧 DSL + 自带 KGP
android.builtInKotlin=false
android.newDsl=false

android.suppressUnsupportedCompileSdk=37
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.java.net.preferIPv4Stack=true

# AGP 9 的资源优化在 newDsl=false 下会产出空资源包（Release APK 缺 AndroidManifest/res），先关掉
android.enableResourceOptimizations=false
